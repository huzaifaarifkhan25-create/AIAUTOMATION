name: aiautomation

services:
  app:
    image: aiautomation:local
    init: true
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-production.env}
    environment:
      APP_ENV: production
      APP_PUBLIC_URL: https://${APP_DOMAIN:?Set APP_DOMAIN to your actual public hostname}
      APP_ALLOWED_HOSTS: ${APP_DOMAIN:?Set APP_DOMAIN},app
      APP_DB_PATH: /data/backend.sqlite3
      SCRAPE_OUTPUT_DIR: /data/scrapes
      PERSISTENCE_BACKEND: sqlite
      BROWSER_RUNTIME: local
      ENABLE_OUTBOUND_CALLS: "false"
    volumes:
      - app-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=256m
    shm_size: 512m
    cpus: 2
    mem_limit: 2g
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 330s

  frontend:
    image: aiautomation-frontend:local
    build:
      context: ../frontend
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BACKEND_URL: http://app:8000
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 1

  caddy:
    image: caddy:2.10.2-alpine@sha256:d8c17a862962def15cde69863a3a463f25a2664942eafd7bdbf050e9c3116b83
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
      N8N_DOMAIN: ${N8N_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL to your contact email}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ${CADDY_CONFIG_FILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
    mem_limit: 256m
    cpus: 0.5
    security_opt: [no-new-privileges:true]

  # Activate with --profile n8n and CADDY_CONFIG_FILE=./Caddyfile.n8n.
  n8n:
    profiles: [n8n]
    image: docker.n8n.io/n8nio/n8n:2.42.6@sha256:526daa38b68e923cc00c5280d18b4da5d489f115a73bdbf3b8e452b184197a9a
    init: true
    restart: unless-stopped
    environment:
      N8N_HOST: ${N8N_DOMAIN:-}
      N8N_PROTOCOL: https
      N8N_PORT: "5678"
      N8N_PROXY_HOPS: "1"
      WEBHOOK_URL: https://${N8N_DOMAIN:-}/
      N8N_EDITOR_BASE_URL: https://${N8N_DOMAIN:-}/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    volumes:
      - n8n-data:/home/node/.n8n
    mem_limit: 2g
    cpus: 1
    security_opt: [no-new-privileges:true]

  # One-shot backup service used by backup-server.sh and the optional timer.
  backup:
    profiles: [maintenance]
    image: aiautomation:local
    env_file: ${APP_ENV_FILE:-production.env}
    environment:
      APP_DB_PATH: /data/backend.sqlite3
      SCRAPE_OUTPUT_DIR: /data/scrapes
      PERSISTENCE_BACKEND: sqlite
    volumes:
      - app-data:/data:ro
      - ${BACKUP_DIRECTORY:?Set BACKUP_DIRECTORY to a private absolute host directory}:/backups
    entrypoint: [python3, /app/backend/backup.py]
    command: [create, --output-dir, /backups]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

volumes:
  app-data:
  n8n-data:
  caddy-data:
  caddy-config:
